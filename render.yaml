services:
  - type: web
    name: medical-admission-api
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && pnpm install && pnpm --filter @repo/api build
    startCommand: pnpm --filter @repo/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false

databases:
  - name: medical-admission-db
    databaseName: medical_admission
    user: medical_user
    plan: free
    region: singapore
