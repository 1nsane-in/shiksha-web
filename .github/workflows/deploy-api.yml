name: Deploy API

on:
  push:
    branches: [main]
    paths: ["apps/api/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action@v1
        with:
          app_id: ${{ secrets.DO_APP_ID }}
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
