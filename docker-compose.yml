version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medical-postgres
    env_file:
      - ./docker/postgres/init.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medical_user -d medical_admission']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medical-redis
    command: redis-server --requirepass redis_password
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: medical-web
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: medical-api
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgresql://medical_user:medical_password@postgres:5432/medical_admission
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: ./apps/ai-service/Dockerfile
    container_name: medical-ai-service
    ports:
      - '8000:8000'
    environment:
      - API_URL=http://api:3001

  nginx:
    image: nginx:alpine
    container_name: medical-nginx
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - ai-service

volumes:
  postgres_data:
  redis_data:
